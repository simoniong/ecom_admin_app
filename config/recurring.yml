production:
  sync_gmail_threads:
    class: SyncGmailThreadsJob
    schedule: every 10 minutes
  tracking_refresh:
    class: TrackingRefreshJob
    schedule: every 3 hours
  poll_tracking_numbers:
    class: PollTrackingNumbersJob
    schedule: every 5 minutes
  sync_ad_metrics:
    class: SyncAdMetricsJob
    schedule: every 30 minutes
  sync_google_ad_metrics:
    class: SyncGoogleAdMetricsJob
    schedule: every 1 hour
  refresh_meta_tokens:
    class: RefreshMetaTokensJob
    schedule: every day at 3am
  sync_shopify_metrics:
    class: SyncShopifyMetricsJob
    schedule: every 1 hour
  sync_ad_campaigns:
    class: SyncAdCampaignsJob
    schedule: every 1 hour
  sync_ad_creatives:
    class: SyncAdCreativesJob
    schedule: every 1 hour
  sync_all_shopify_orders:
    class: SyncAllShopifyOrdersRecurringJob
    schedule: every 1 hour
  sync_all_shopify_products:
    class: SyncAllShopifyProductsRecurringJob
    schedule: every day at 4am
  shipping_reminder_check:
    class: ShippingReminderCheckJob
    schedule: every 15 minutes
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  purge_sync_runs:
    command: "SyncRun.purge_older_than(7.days)"
    schedule: every day at 5am

development:
  shipping_reminder_check:
    class: ShippingReminderCheckJob
    schedule: every 15 minutes
  sync_gmail_threads:
    class: SyncGmailThreadsJob
    schedule: every 10 minutes
  tracking_refresh:
    class: TrackingRefreshJob
    schedule: every 3 hours
  poll_tracking_numbers:
    class: PollTrackingNumbersJob
    schedule: every 5 minutes
  sync_ad_metrics:
    class: SyncAdMetricsJob
    schedule: every 30 minutes
  refresh_meta_tokens:
    class: RefreshMetaTokensJob
    schedule: every day at 3am
  sync_shopify_metrics:
    class: SyncShopifyMetricsJob
    schedule: every 1 hour
  sync_ad_campaigns:
    class: SyncAdCampaignsJob
    schedule: every 1 hour
  sync_ad_creatives:
    class: SyncAdCreativesJob
    schedule: every 1 hour
  sync_all_shopify_orders:
    class: SyncAllShopifyOrdersRecurringJob
    schedule: every 1 hour
